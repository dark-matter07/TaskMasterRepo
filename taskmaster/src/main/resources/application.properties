spring.application.name=taskmaster
server.port = 9090

spring.datasource.url = jdbc:postgresql://localhost:5432/taskmaster
spring.datasource.username = sakshi
spring.datasource.password = sakshi1234
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database = POSTGRESQL
spring.jpa.show-sql = true
spring.jpa.database-platform  = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.format_sql = true

management.endpoints.web.exposure.include = *

management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name = TaskMaster
info.app.version  = v1
info.app.description = contains_Basic_RestApi